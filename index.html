<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geländer PRO V2.0</title><style>*{box-sizing:border-box}body{margin:0;background:#edf1f4;color:#202c38;font:16px system-ui}header{background:#202c38;color:white;padding:24px}header h1{margin:0}main{max-width:1100px;margin:auto;padding:16px}section,article{background:white;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #0001}input,select,textarea,button{font:inherit;padding:12px;border:1px solid #bcc6ce;border-radius:8px;max-width:100%}input,textarea,select{width:100%;margin:5px 0 12px}button{background:#29485f;color:white;cursor:pointer;margin:4px 4px 4px 0}label{display:block}button.danger{background:#a52b36}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}img{width:100%;height:190px;object-fit:contain;background:#edf1f4;border-radius:8px}#msg{white-space:pre-wrap;color:#a52b36}small{color:#64748b} [hidden]{display:none!important}dialog{width:min(95%,650px);max-height:90vh;overflow:auto;border:0;border-radius:14px} .photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}h2{margin-top:0}</style></head><body><header><h1>GELÄNDER PRO</h1>Digitale Musterbibliothek · V2.0</header><main><p id="msg" role="status"></p><section id="login"><h2>Firmenzugang</h2><form id="loginForm"><label>E-Mail<input id="email" type="email" required autocomplete="username"></label><label>Passwort<input id="pw" type="password" required autocomplete="current-password"></label><button>Anmelden</button></form></section><div id="library" hidden><section><span id="role"></span><button id="logout">Abmelden</button><button id="refresh">Aktualisieren</button><button id="add" hidden>+ Geländer hinzufügen</button><input id="search" placeholder="Muster, Material, Bezeichnung suchen"><small id="count"></small></section><div id="cards"></div></div><dialog id="detail"><div id="details"></div><button id="closeDetail">Schließen</button></dialog><dialog id="editor"><form id="editForm"><h2>Mustergeländer bearbeiten</h2><div id="fields"></div><div id="existing"></div><label>Originalfotos hinzufügen (JPEG, PNG, WebP; je max. 15 MB)<input id="uploads" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><button id="save">Speichern</button><button type="button" id="cancel">Abbrechen</button></form></dialog></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://xgisjlvpaabxkbcxpdjo.supabase.co','sb_publishable_d6Huy0rZgcd0kOa6SMAClA_13Wij57O');
const $=id=>document.getElementById(id), msg=s=>{$('msg').textContent=s||''}; const bucket=db.storage.from('gelaender-fotos');let rows=[],admin=false,editing=null,keep=[],generation=0;const fields=[['musternummer','Musternummer',1],['bezeichnung','Bezeichnung',1],['material','Material',1],['werkstoff','Werkstoff'],['gewicht_pro_meter','Gewicht kg/m',1,'number'],['hoehe_mm','Höhe mm',0,'number'],['handlauf','Handlauf'],['steher','Steher'],['fuellung','Füllung'],['oberflaeche','Oberfläche'],['ral_farbe','RAL-Farbe'],['befestigung','Befestigung'],['notizen','Notizen']];function el(tag,t,parent){const n=document.createElement(tag);if(t!=null)n.textContent=t;if(parent)parent.append(n);return n}function btn(t,fn,p){const b=el('button',t,p);b.type='button';b.onclick=fn;return b}function check(r){if(r.error)throw r.error;return r.data}function err(e){msg(e.message||String(e))}async function photo(path,p){const img=el('img',null,p);img.alt='Originalfoto';try{img.src=check(await bucket.createSignedUrl(path,300)).signedUrl}catch(e){img.alt='Foto nicht verfügbar'}}
async function load(){let g=++generation;try{const data=check(await db.from('gelaender').select('*').order('musternummer'));if(g!==generation)return;rows=data;render()}catch(e){err(e)}}function render(){const p=$('cards');p.replaceChildren();let q=$('search').value.toLowerCase();const items=rows.filter(r=>[r.musternummer,r.bezeichnung,r.material,r.werkstoff].join(' ').toLowerCase().includes(q));$('count').textContent=items.length+' Mustergeländer';for(const r of items){const a=el('article',null,p);if(r.fotos?.length)photo(r.fotos[0],a);else el('small','Noch kein Originalfoto',a);el('h2',r.musternummer+' · '+r.bezeichnung,a);el('p',r.material,a);el('h3',r.gewicht_pro_meter+' kg/m',a);btn('Details',()=>details(r),a);if(admin)btn('Bearbeiten',()=>edit(r),a)}}
function details(r){const p=$('details');p.replaceChildren();el('h2',r.bezeichnung,p);const ph=el('div',null,p);ph.className='photos';for(const path of r.fotos||[])photo(path,ph);for(const [k,l] of fields)if(r[k]!=null&&r[k]!=='')el('p',l+': '+r[k],p);el('h3','Gewichtsrechner',p);const n=el('input',null,p);n.type='number';n.min=0;n.step='any';n.value=1;n.setAttribute('aria-label','Länge in Metern');const out=el('p',r.gewicht_pro_meter+' kg',p);n.oninput=()=>out.textContent=(Math.max(0,Number(n.value)||0)*Number(r.gewicht_pro_meter)).toLocaleString('de-AT',{maximumFractionDigits:2})+' kg';$('detail').showModal()}
function edit(r){if(!admin)return;editing=r;keep=[...(r?.fotos||[])];$('fields').replaceChildren();for(const [k,l,req,type] of fields){const lab=el('label',l,$('fields'));const inp=el(k==='notizen'?'textarea':'input',null,lab);inp.name=k;inp.required=!!req;if(type){inp.type=type;inp.min=0;inp.step='any'}inp.value=r?.[k]??''} $('uploads').value='';renderExisting();$('editor').showModal()}
function renderExisting(){const p=$('existing');p.replaceChildren();for(const path of keep){const a=el('div',null,p);photo(path,a);btn('Foto entfernen',()=>{keep=keep.filter(x=>x!==path);renderExisting()},a)}if(editing){const b=btn('Geländer löschen',async()=>{if(!confirm('Dieses Geländer wirklich löschen?'))return;try{check(await db.from('gelaender').delete().eq('id',editing.id).select('id').single());if(editing.fotos?.length){const result=await bucket.remove(editing.fotos);if(result.error)msg('Gelöscht, Fotos konnten nicht bereinigt werden.')} $('editor').close();await load()}catch(e){err(e);alert(e.message)}},p);b.className='danger'}}
$('editForm').onsubmit=async e=>{e.preventDefault();if(!admin)return;const b=$('save');b.disabled=true;const uploaded=[];let saved=false;try{const id=editing?.id||crypto.randomUUID(), data={id};for(const [k,l,req,type] of fields){const v=new FormData(e.target).get(k).trim();data[k]=type==='number'?(v===''?null:Number(v)):v}const files=[...$('uploads').files];if(keep.length+files.length>12)throw Error('Maximal 12 Fotos pro Muster.');for(const f of files){const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[f.type];if(!ext||f.size>15728640)throw Error('Bitte JPEG, PNG oder WebP bis 15 MB verwenden.');const path=id+'/'+crypto.randomUUID()+'.'+ext;check(await bucket.upload(path,f,{contentType:f.type}));uploaded.push(path)}data.fotos=[...keep,...uploaded];check(await (editing?db.from('gelaender').update(data).eq('id',id):db.from('gelaender').insert(data)).select('id').single());saved=true;const removed=(editing?.fotos||[]).filter(x=>!keep.includes(x));if(removed.length){const r=await bucket.remove(removed);if(r.error)msg('Gespeichert, alte Fotos konnten nicht bereinigt werden.')} $('editor').close();await load()}catch(e){if(!saved&&uploaded.length)await bucket.remove(uploaded);err(e);alert(e.message)}finally{b.disabled=false}};
$('loginForm').onsubmit=async e=>{e.preventDefault();msg('');try{check(await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('pw').value}));$('pw').value=''}catch(e){err(e)}}; $('logout').onclick=async()=>{try{check(await db.auth.signOut())}catch(e){err(e)}}; $('refresh').onclick=load;$('add').onclick=()=>edit(null);$('search').oninput=render;$('closeDetail').onclick=()=>$('detail').close();$('cancel').onclick=()=>$('editor').close();db.auth.onAuthStateChange((event,session)=>{admin=session?.user?.app_metadata?.rolle==='admin';$('login').hidden=!!session;$('library').hidden=!session;$('add').hidden=!admin;$('role').textContent=admin?'Administrator':'Mitarbeiter · Lesezugriff';if(session)setTimeout(load,0);else{generation++;rows=[];render();for(const id of ['editor','detail'])if($(id).open)$(id).close()}});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('library').hidden)load()});
</script></body></html>
