<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geländer PRO V2.2</title><style>*{box-sizing:border-box}body{margin:0;background:#edf1f4;color:#202c38;font:16px system-ui}header{background:#202c38;color:white;padding:24px}header h1{margin:0}main{max-width:1100px;margin:auto;padding:16px}section,article{background:white;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #0001}input,select,textarea,button{font:inherit;padding:12px;border:1px solid #bcc6ce;border-radius:8px;max-width:100%}input,textarea,select{width:100%;margin:5px 0 12px}button{background:#29485f;color:white;cursor:pointer;margin:4px 4px 4px 0}label{display:block}button.danger{background:#a52b36}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}img{width:100%;height:190px;object-fit:contain;background:#edf1f4;border-radius:8px}#msg{white-space:pre-wrap;color:#a52b36}small{color:#64748b} [hidden]{display:none!important}dialog{width:min(95%,650px);max-height:90vh;overflow:auto;border:0;border-radius:14px} .photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}h2{margin-top:0}header{padding: max(22px,env(safe-area-inset-top)) 24px 22px;background:linear-gradient(120deg,#162532,#31536a)}header h1{letter-spacing:.06em}button{border:0}button:disabled{opacity:.5}article h2{font-size:1.2rem;margin:10px 0}article h3{font-size:1.5rem;margin:8px 0}dialog{max-height:85dvh;margin:auto;padding:20px}dialog::backdrop{background:#14233399}#cards.list{display:block}#cards.list article{display:grid;grid-template-columns:100px 1fr;gap:8px;align-items:center}#cards.list article img{height:110px}#cards.list article .summary{min-width:0}img{cursor:zoom-in;height:230px}#zoom img{height:auto;max-height:72dvh;object-fit:contain} .toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar select{flex:1;min-width:120px}.photoitem{border:1px solid #dde3e8;padding:8px;border-radius:10px;margin:8px 0}.photoitem img{height:150px}@media print{body{background:white}header,main>*{display:none!important}main{display:block!important}#detail[open]{display:block!important;position:static;width:100%;max-height:none;overflow:visible;box-shadow:none}#detail button,#detail input,#detail .calc{display:none!important} #detail img{height:150px}dialog::backdrop{display:none}}</style></head><body><header><h1>GELÄNDER PRO</h1>Digitale Musterbibliothek · V2.2</header><main><p id="msg" role="status"></p><section id="login"><h2>Firmenzugang</h2><form id="loginForm"><label>E-Mail<input id="email" type="email" required autocomplete="username"></label><label>Passwort<input id="pw" type="password" required autocomplete="current-password"></label><button>Anmelden</button></form></section><div id="library" hidden><section><span id="role"></span><button id="logout">Abmelden</button><button id="refresh">Aktualisieren</button><button id="add" hidden>+ Geländer hinzufügen</button><input id="search" placeholder="Muster, Material, Bezeichnung suchen"><div class="toolbar"><select id="materialFilter" aria-label="Materialfilter"><option value="">Alle Werkstoffe</option></select><select id="layout" aria-label="Ansicht"><option value="grid">Kachelansicht</option><option value="list">Listenansicht</option></select></div><button id="compare">Vergleich</button><button id="export">Excel-Export (CSV)</button><small id="count"></small></section><div id="cards"></div></div><dialog id="comparison"><h2>Geländervergleich</h2><div id="choices"></div><div id="comparisonResult" style="overflow:auto"></div><button id="closeCompare">Schließen</button></dialog><dialog id="detail"><div id="details"></div><button id="printDetail">Datenblatt / PDF</button><button id="closeDetail">Schließen</button></dialog><dialog id="editor"><form id="editForm" novalidate><h2>Mustergeländer bearbeiten</h2><div id="fields"></div><div id="existing"></div><label>Originalfotos hinzufügen (JPEG, PNG, WebP; je max. 15 MB)<input id="uploads" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div id="uploadPreview" class="photos"></div><p id="editMsg" role="alert" style="white-space:pre-wrap;color:#a52b36"></p><button type="submit" id="save">Speichern</button><button type="button" id="cancel">Abbrechen</button></form></dialog><dialog id="zoom"><img id="zoomImg" alt="Originalfoto groß"><button id="closeZoom">Schließen</button></dialog><div id="preview"></div></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://xgisjlvpaabxkbcxpdjo.supabase.co','sb_publishable_d6Huy0rZgcd0kOa6SMAClA_13Wij57O');
const $=id=>document.getElementById(id), msg=s=>{$('msg').textContent=s||''}; const bucket=db.storage.from('gelaender-fotos');let rows=[],admin=false,editing=null,keep=[],generation=0;const fields=[['musternummer','Musternummer',1],['bezeichnung','Bezeichnung',1],['material','Material',1],['werkstoff','Werkstoff'],['gewicht_pro_meter','Gewicht kg/m',1,'number'],['hoehe_mm','Höhe mm',0,'number'],['handlauf','Handlauf'],['steher','Steher'],['fuellung','Füllung'],['oberflaeche','Oberfläche'],['ral_farbe','RAL-Farbe'],['befestigung','Befestigung'],['notizen','Notizen']];function el(tag,t,parent){const n=document.createElement(tag);if(t!=null)n.textContent=t;if(parent)parent.append(n);return n}function btn(t,fn,p){const b=el('button',t,p);b.type='button';b.onclick=fn;return b}function check(r){if(r.error)throw r.error;return r.data}function err(e){msg(e.message||String(e))}async function photo(paths,p){const list=Array.isArray(paths)?paths:[paths];const box=el('div',null,p);const status=el('small','Foto wird geladen …',box);for(const path of list){let url;try{const blob=check(await bucket.download(path));if(!blob.size)throw Error('Leere Bilddatei');url=URL.createObjectURL(blob);const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});img.alt='Originalfoto';box.replaceChildren(img);img.onclick=()=>{const z=$('zoomImg');const u=URL.createObjectURL(blob);z.src=u;$('zoom').showModal();$('zoom').addEventListener('close',()=>{z.removeAttribute('src');URL.revokeObjectURL(u)},{once:true})};return}catch(e){}finally{if(url)URL.revokeObjectURL(url)}}status.textContent='Kein verfügbares Foto';}
async function load(){let g=++generation;try{const data=check(await db.from('gelaender').select('*').order('musternummer'));if(g!==generation)return;rows=data;const f=$('materialFilter'), old=f.value;f.replaceChildren(new Option('Alle Werkstoffe',''));for(const m of [...new Set(rows.map(r=>r.werkstoff||r.material).filter(Boolean))].sort())f.add(new Option(m,m));f.value=old;render()}catch(e){err(e)}}function render(){const p=$('cards');p.replaceChildren();let q=$('search').value.toLowerCase();p.className=$('layout').value==='list'?'list':'';const items=rows.filter(r=>(!$('materialFilter').value||(r.werkstoff||r.material)===$('materialFilter').value)&&[r.musternummer,r.bezeichnung,r.material,r.werkstoff].join(' ').toLowerCase().includes(q));$('count').textContent=items.length+' Mustergeländer';for(const r of items){const a=el('article',null,p);if(r.fotos?.length)photo(r.fotos,a);else el('small','Noch kein Originalfoto',a);const summary=el('div',null,a);summary.className='summary';el('h2',r.musternummer+' · '+r.bezeichnung,summary);el('p',[r.werkstoff,r.material].filter(Boolean).join(' · '),summary);el('h3',r.gewicht_pro_meter+' kg/m',summary);btn('Details',()=>details(r),summary);if(admin)btn('Bearbeiten',()=>edit(r),summary)}}
function details(r){const p=$('details');p.replaceChildren();el('h2',r.bezeichnung,p);const ph=el('div',null,p);ph.className='photos';for(const path of r.fotos||[])photo(path,ph);for(const [k,l] of fields)if(r[k]!=null&&r[k]!=='')el('p',l+': '+r[k],p);const calc=el('div',null,p);calc.className='calc';el('h3','Gewichtsrechner',calc);el('label','Länge in Metern',calc);const n=el('input',null,calc);n.type='number';n.min=0;n.step='any';n.value=1;n.setAttribute('aria-label','Länge in Metern');el('label','Stückzahl',calc);const qty=el('input',null,calc);qty.type='number';qty.min=1;qty.step=1;qty.value=1;qty.setAttribute('aria-label','Stückzahl');const out=el('p',r.gewicht_pro_meter+' kg',calc);const recalc=()=>{const count=Number(qty.value),len=Number(n.value);out.textContent=Number.isInteger(count)&&count>0&&len>=0&&n.value!==''?('Gesamtlänge: '+(len*count).toLocaleString('de-AT')+' m · Gesamtgewicht: '+(len*count*Number(r.gewicht_pro_meter)).toLocaleString('de-AT',{maximumFractionDigits:2})+' kg'):'Bitte gültige Länge und Stückzahl eingeben';};n.oninput=qty.oninput=recalc;recalc();$('detail').showModal()}
function edit(r){if(!admin)return;$('editMsg').textContent='';editing=r;keep=[...(r?.fotos||[])];$('fields').replaceChildren();for(const [k,l,req,type] of fields){const lab=el('label',l,$('fields'));const inp=el(k==='notizen'?'textarea':'input',null,lab);inp.name=k;inp.required=!!req;if(type){inp.type=type;inp.min=0;inp.step='any'}inp.value=r?.[k]??''} $('uploads').value='';$('uploads').onchange();renderExisting();$('editor').showModal()}
function renderExisting(){const p=$('existing');p.replaceChildren();for(const path of keep){const a=el('div',null,p);a.className='photoitem';photo(path,a);if(keep[0]===path)el('small','Hauptfoto',a);else btn('Als Hauptfoto',()=>{keep=[path,...keep.filter(x=>x!==path)];renderExisting()},a);btn('Foto entfernen',()=>{keep=keep.filter(x=>x!==path);renderExisting()},a)}if(editing){const b=btn('Geländer löschen',async()=>{if(!confirm('Dieses Geländer wirklich löschen?'))return;try{check(await db.from('gelaender').delete().eq('id',editing.id).select('id').single());if(editing.fotos?.length){const result=await bucket.remove(editing.fotos);if(result.error)msg('Gelöscht, Fotos konnten nicht bereinigt werden.')} $('editor').close();await load()}catch(e){err(e);alert(e.message)}},p);b.className='danger'}}
$('editForm').onsubmit=async e=>{e.preventDefault();if(!admin){$('editMsg').textContent='Keine Administratorrechte. Bitte erneut anmelden.';return;}const b=$('save');const form=e.target;for(const [k,l,req,type] of fields){const inp=form.elements.namedItem(k);if((req&&!inp.value.trim())||!inp.validity.valid){$('editMsg').textContent='Bitte gültigen Wert eingeben: '+l;inp.scrollIntoView({block:'center'});inp.focus();inp.reportValidity();return;}}b.disabled=true;for(const x of $('editor').querySelectorAll('button:not(#save),input,textarea'))x.disabled=true;b.textContent='Speichert …';$('editMsg').textContent='Daten und Fotos werden gespeichert …';const uploaded=[];let saved=false;try{const id=editing?.id||crypto.randomUUID(), data={id};for(const [k,l,req,type] of fields){const v=form.elements.namedItem(k).value.trim();data[k]=type==='number'?(v===''?null:Number(v)):v}const files=[...$('uploads').files];if(keep.length+files.length>12)throw Error('Maximal 12 Fotos pro Muster.');for(const f of files){$('editMsg').textContent='Foto wird hochgeladen: '+f.name;const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[f.type];if(!ext||f.size>15728640)throw Error('Bitte JPEG, PNG oder WebP bis 15 MB verwenden.');const path=id+'/'+crypto.randomUUID()+'.'+ext;check(await bucket.upload(path,f,{contentType:f.type}));uploaded.push(path)}$('editMsg').textContent='Geländerdaten werden gespeichert …';data.fotos=[...keep,...uploaded];check(await (editing?db.from('gelaender').update(data).eq('id',id):db.from('gelaender').insert(data)).select('id').single());saved=true;const removed=(editing?.fotos||[]).filter(x=>!keep.includes(x));if(removed.length){const r=await bucket.remove(removed);if(r.error)msg('Gespeichert, alte Fotos konnten nicht bereinigt werden.')} $('editor').close();await load()}catch(e){err(e);$('editMsg').textContent='Speichern fehlgeschlagen: '+(e.message||String(e));}finally{b.disabled=false;for(const x of $('editor').querySelectorAll('button,input,textarea'))x.disabled=false;b.textContent='Speichern'}};
$('materialFilter').onchange=render;$('layout').onchange=render;$('printDetail').onclick=()=>window.print();$('closeZoom').onclick=()=>$('zoom').close();$('uploads').onchange=()=>{const p=$('uploadPreview');p.replaceChildren();for(const f of $('uploads').files){const img=el('img',null,p);const u=URL.createObjectURL(f);img.onload=img.onerror=()=>URL.revokeObjectURL(u);img.src=u;img.alt=f.name}};
$('loginForm').onsubmit=async e=>{e.preventDefault();msg('');try{check(await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('pw').value}));$('pw').value=''}catch(e){err(e)}}; $('logout').onclick=async()=>{try{check(await db.auth.signOut())}catch(e){err(e)}}; $('refresh').onclick=load;$('add').onclick=()=>edit(null);$('search').oninput=render;$('closeDetail').onclick=()=>$('detail').close();$('cancel').onclick=()=>$('editor').close();db.auth.onAuthStateChange((event,session)=>{admin=session?.user?.app_metadata?.rolle==='admin';$('login').hidden=!!session;$('library').hidden=!session;$('add').hidden=!admin;$('role').textContent=admin?'Administrator':'Mitarbeiter · Lesezugriff';if(session)setTimeout(load,0);else{generation++;rows=[];render();for(const id of ['editor','detail'])if($(id).open)$(id).close()}});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('library').hidden)load()});
$('compare').onclick=()=>{const p=$('choices');p.replaceChildren();const sels=[];for(let i=0;i<3;i++){const sel=el('select',null,p);sel.add(new Option('Muster '+(i+1)+' auswählen',''));for(const r of rows)sel.add(new Option(r.musternummer+' · '+r.bezeichnung,r.id));sels.push(sel);sel.onchange=draw;}function draw(){const chosen=[...new Set(sels.map(s=>s.value).filter(Boolean))].map(id=>rows.find(r=>r.id===id)).filter(Boolean);const p=$('comparisonResult');p.replaceChildren();if(!chosen.length){el('p','Bitte Muster auswählen.',p);return}const table=el('table',null,p);table.style.cssText='border-collapse:collapse;width:100%';for(const [k,l] of fields){const tr=el('tr',null,table);el('th',l,tr);for(const r of chosen){const td=el('td',String(r[k]??'–'),tr);td.style.cssText='padding:8px;border-bottom:1px solid #ddd;min-width:95px'}}}draw();$('comparison').showModal()};$('closeCompare').onclick=()=>$('comparison').close();
$('export').onclick=()=>{const quote=v=>{let t=String(v??'');if(/^[\s]*[=+@-]/.test(t))t="'"+t;return '"'+t.replaceAll('"','""')+'"'};const csv=[fields.map(f=>quote(f[1])).join(';'),...rows.map(r=>fields.map(([k,l,req,type])=>quote(type==='number'&&r[k]!=null?String(r[k]).replace('.',','):r[k])).join(';'))].join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Gelaender-PRO.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};
</script></body></html>
